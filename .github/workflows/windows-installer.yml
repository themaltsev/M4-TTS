name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'requirements-piper.txt'
      - 'requirements-edge.txt'
      - 'scripts/download_voice.py'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies and packager
        run: python -m pip install -r requirements-piper.txt -r requirements-edge.txt pygame keyboard pystray pillow pyinstaller
      - name: Download the default local voice
        run: python scripts/download_voice.py dist/models
      - name: Verify Piper can synthesize the local voice
        run: >-
          python -c "import wave; from piper import PiperVoice; v=PiperVoice.load('dist/models/ru_RU-irina-medium.onnx'); f=wave.open('smoke.wav','wb'); v.synthesize_wav('Проверка локальной модели',f); f.close()"
      - name: Build Windows executable
        run: >-
          pyinstaller --clean --noconfirm --onefile --console
          --name selected-text-speech
          --collect-all edge_tts --collect-all piper --collect-all onnxruntime
          --collect-all pygame --collect-all pystray --collect-all PIL
          --hidden-import keyboard --hidden-import onnxruntime.capi.onnxruntime_pybind11_state
          windows/speech.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc windows/installer.iss
      - name: Install and verify Windows package
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'dist/install-windows.exe').Path
          $result = Start-Process -FilePath $installer `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            throw "Installer failed with exit code $($result.ExitCode)"
          }

          $installDir = Join-Path $env:LOCALAPPDATA 'SelectedTextSpeech'
          $appExe = Join-Path $installDir 'selected-text-speech.exe'
          $runner = Join-Path $installDir 'run-tray.vbs'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstallCommand = Join-Path $installDir 'uninstall-windows.cmd'
          foreach ($path in @($appExe, $runner, $uninstaller, $uninstallCommand)) {
            if (-not (Test-Path $path)) { throw "Missing installed file: $path" }
          }

          $shortcutPath = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Selected Text Speech.lnk'
          if (-not (Test-Path $shortcutPath)) { throw "Missing Start Menu shortcut: $shortcutPath" }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          if ($shortcut.TargetPath -notlike '*\wscript.exe') {
            throw "Shortcut does not use Windows Script Host: $($shortcut.TargetPath)"
          }
          if ($shortcut.Arguments -notmatch 'run-tray\.vbs') {
            throw "Shortcut does not pass run-tray.vbs: $($shortcut.Arguments)"
          }

          $uninstallShortcutPath = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Удалить Selected Text Speech.lnk'
          if (-not (Test-Path $uninstallShortcutPath)) {
            throw "Missing uninstall shortcut: $uninstallShortcutPath"
          }
          $uninstallShortcut = $shell.CreateShortcut($uninstallShortcutPath)
          if ($uninstallShortcut.TargetPath -notlike '*\unins*.exe') {
            throw "Uninstall shortcut does not target the uninstaller: $($uninstallShortcut.TargetPath)"
          }

          $wscript = Join-Path $env:WINDIR 'System32\wscript.exe'
          $arguments = '"{0}" "{1}"' -f $runner, $appExe
          $launch = Start-Process -FilePath $wscript -ArgumentList $arguments -PassThru
          $appProcess = $null
          $deadline = (Get-Date).AddSeconds(20)
          try {
            do {
              $appProcess = Get-Process -Name 'selected-text-speech' -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($appProcess) { break }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if (-not $appProcess) {
              throw 'run-tray.vbs did not start selected-text-speech.exe through WScript'
            }
          }
          finally {
            if ($appProcess) {
              Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            }
            Stop-Process -Id $launch.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: install-windows
          path: dist/install-windows.exe
          if-no-files-found: error
          retention-days: 30
