name: Windows installer

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'requirements-piper.txt'
      - 'requirements-edge.txt'
      - 'scripts/download_voice.py'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies and packager
        run: python -m pip install -r requirements-piper.txt -r requirements-edge.txt pygame keyboard pystray pillow pyinstaller
      - name: Download the default local voice
        run: python scripts/download_voice.py dist/models
      - name: Verify Piper can synthesize the local voice
        run: >-
          python -c "import wave; from piper import PiperVoice; v=PiperVoice.load('dist/models/ru_RU-irina-medium.onnx'); f=wave.open('smoke.wav','wb'); v.synthesize_wav('Проверка локальной модели',f); f.close()"
      - name: Build Windows executable
        run: >-
          pyinstaller --clean --noconfirm --onefile --console
          --name selected-text-speech
          --collect-all edge_tts --collect-all piper --collect-all onnxruntime
          --collect-all pygame --collect-all pystray --collect-all PIL
          --hidden-import keyboard --hidden-import onnxruntime.capi.onnxruntime_pybind11_state
          windows/speech.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        run: iscc windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: install-windows
          path: dist/install-windows.exe
          if-no-files-found: error
          retention-days: 30
